name: test
on:
  push:
    branches:
    - main
    - dev
  pull_request:
jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: azure/setup-helm@v5
      with:
        version: v4.2.0
      id: install
    - name: Validation
      run: find charts -type d -maxdepth 1 -mindepth 1 | xargs -I {} helm lint {}